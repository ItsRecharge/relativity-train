<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relativity Express</title>
<meta name="description" content="Einstein's light clock in 3D. Ride the train and the photon bounces straight; watch from the platform and the same photon traces a zigzag. Time dilation, computed live." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101420'/%3E%3Crect x='8' y='6' width='16' height='3' rx='1.5' fill='%23cfd8e6'/%3E%3Crect x='8' y='23' width='16' height='3' rx='1.5' fill='%23cfd8e6'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23f5b942'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<header id="topbar">
  <div id="brand">
    <h1>Relativity Express</h1>
    <p>Einstein's light clock, from two frames</p>
  </div>
  <div id="frameToggle" role="tablist" aria-label="Reference frame">
    <button id="btnPlatform" class="frame-btn active" role="tab">Platform view</button>
    <button id="btnTrain" class="frame-btn" role="tab">On the train</button>
  </div>
  <button id="btnPause" class="chip">Pause</button>
</header>

<aside id="controls">
  <section class="block">
    <div class="label">Train speed</div>
    <div id="betaRow"><span id="betaValue">0.700</span><span class="unit">c</span></div>
    <input type="range" id="speedSlider" min="0" max="99.9" step="0.1" value="70" aria-label="Train speed in percent of c" />
    <div id="presets">
      <button data-beta="0.5">0.5c</button>
      <button data-beta="0.866">0.866c</button>
      <button data-beta="0.99">0.99c</button>
    </div>
  </section>

  <section class="block">
    <dl id="readouts">
      <div><dt>Lorentz factor γ</dt><dd id="roGamma">1.400</dd></div>
      <div><dt>Speed</dt><dd id="roSpeed">0.755 billion km/h</dd></div>
      <div><dt id="roLengthLabel">Train length here</dt><dd id="roLength">57.1 m of 80 m</dd></div>
      <div><dt id="roRateLabel">Train clock ticks at</dt><dd id="roRate">71.4%</dd></div>
    </dl>
  </section>

  <section class="block">
    <div class="label">Elapsed time <button id="btnReset" class="mini">Reset</button></div>
    <div class="clockrow"><span class="who">Platform</span><span class="tval" id="clockPlatform">0.00 s</span></div>
    <div class="clockrow"><span class="who accent">Train clock</span><span class="tval accent" id="clockTrain">0.00 s</span><span class="ticks" id="ticksTrain">0 ticks</span></div>
  </section>

  <section class="block">
    <p id="explain"></p>
  </section>

  <div id="keys"><kbd>F</kbd> switch frame <kbd>Space</kbd> pause <kbd>R</kbd> reset</div>
</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
